[project]
name = "autodl-skill"
version = "0.1.0"
description = "Reusable AutoDL Pro instance helper for agent workflows"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project.scripts]
autodl = "autodl_skill.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
