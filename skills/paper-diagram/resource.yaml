activation:
  mode: automatic
  notes: >
    Activate when user provides an image and wants it redrawn for academic
    papers (flowcharts, architecture diagrams, pipeline figures). Keywords:
    "redraw", "remake for paper", "publication figure", "论文用图", "重画".

verification:
  commands:
    - "python3 -c \"import pptx; print('python-pptx OK')\""
    - "python3 -c \"from PIL import Image; print('Pillow OK')\""
    - "which soffice || echo 'WARNING: soffice not found'"
    - "which pdftoppm || echo 'WARNING: pdftoppm not found'"
  notes:
    - "The skill instructs the LLM to write and execute python-pptx scripts."
    - "convert.py requires LibreOffice + Poppler for PPTX→PDF→image pipeline."

