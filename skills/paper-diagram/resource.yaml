risk:
  level: medium
  reason: >
    Bundled scripts run external converters (rsvg-convert, soffice, pdftoppm)
    as subprocesses for SVG/PPTX→PDF→JPG export. PPTX export may compile C
    code as a sandbox fallback. No network access, no API keys, no secrets.

activation:
  mode: automatic
  notes: >
    Activate when user provides an image or text spec and wants a publication
    diagram, paper figure, SVG/PDF asset, or editable PPTX fallback. Keywords:
    "redraw", "remake for paper", "publication figure", "论文用图", "重画",
    "SVG", "PDF figure", "LaTeX".

verification:
  commands:
    - "python3 -c \"import pptx; print('python-pptx OK')\""
    - "python3 -c \"from PIL import Image; print('Pillow OK')\""
    - "which rsvg-convert || echo 'WARNING: rsvg-convert not found'"
    - "which soffice || echo 'WARNING: soffice not found'"
    - "which pdftoppm || echo 'WARNING: pdftoppm not found'"
  notes:
    - "Default SVG backend uses scripts/svg_export.py."
    - "PPTX fallback uses scripts/pptx_layout.py and scripts/pptx_export.py."

maintenance:
  last_reviewed: "2026-06-01"
  notes:
    - "Initial creation as PPTX-first skill."
    - "Refactored to SVG-first with unified Figure Spec and PPTX fallback."
    - "Color palettes and spacing derived from academic publishing conventions."
    - "Sandbox shim code localized from anthropic-skills/pptx/scripts/office/soffice.py."

relationships:
  extensions: []
  tools:
    - rsvg-convert
    - LibreOffice (soffice)
    - Poppler (pdftoppm)
    - python-pptx
    - Pillow
  packages:
