  summarize:
    enabled: true
    prose: false
lsp:
  enabled: true
  formatOnWrite: false
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
bashInterceptor:
  enabled: true
todo:
  enabled: true
  reminders: false
  eager: default
astGrep:
  enabled: true
astEdit:
  enabled: true
recipe:
  enabled: true
debug:
  enabled: true
web_search:
  enabled: true
browser:
  enabled: true
  headless: false
  relay: true
fetch:
  enabled: true
images:
  blockImages: false
  autoResize: true
github:
  enabled: true
  cache:
    enabled: true
renderMermaid:
  enabled: true
checkpoint:
  enabled: false
ttsr:
  enabled: true
  contextMode: discard
  interruptMode: always
  repeatMode: once
