modelRoles:
  default: cpa/gpt-5.6-sol:medium
  smol: cpa/gpt-5.6-luna:high
  fast_worker: cpa/gpt-5.6-luna:high
  good_worker: cpa/gpt-5.6-luna:max
  task: cpa/gpt-5.6-luna:max
  commit: cpa/gpt-5.6-luna:medium
  tiny: cpa/gpt-5.6-luna:low
  plan: cpa/gpt-5.6-sol:high
  designer: cpa/gpt-5.6-sol:medium
  vision: cpa/gpt-5.6-sol:high
  slow: cpa/gpt-5.6-sol:high
  review: cpa/gpt-5.6-sol:high

# Keep bundled Vibe usable as a compatibility path, but Harness v2 prefers
# custom task agents with restricted tools.
task:
  eager: default
  batch: true
  maxConcurrency: 2
  maxRecursionDepth: 1
  enableEffort: false
  agentModelOverrides:
    sonic: "@fast_worker"
    task: "@good_worker"

prewalk:
  enabled: false

advisor:
  enabled: false

# Main sessions can opt into notes-backed context management. Restricted
# workers that lack the required tools automatically retain legacy maintenance.
compaction:
  enabled: true
  experimentalContextManagement: true
  methodOrder:
    - shake
    - soft
  asyncEnabled: false
  keepRecentTokens: 20000
