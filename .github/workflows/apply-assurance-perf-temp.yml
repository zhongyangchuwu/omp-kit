name: Temporary assurance performance patch

on:
  push:
    branches:
      - feat/omp-18.2.3-assurance-performance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omp-18.2.3-assurance-performance
      - name: Apply focused source/test edits
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected snippet in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "scripts/session_assurance.ts",
              'import { deriveTraceScopeEvidence } from "../src/assurance/scope/derive";',
              'import { createScopeDerivationDiagnostics, deriveTraceScopeEvidence, type ScopeDerivationDiagnostics } from "../src/assurance/scope/derive";'
          )
          replace(
              "scripts/session_assurance.ts",
              'import { BUILTIN_SCOPE_CLASSIFIERS } from "../src/assurance/scope/registry";',
              'import { BUILTIN_SCOPE_CLASSIFIERS, BUILTIN_SCOPE_TOOL_NAMES } from "../src/assurance/scope/registry";'
          )
          replace(
              "scripts/session_assurance.ts",
              '\tincludeScope: boolean,\n): Promise<AssuranceReport> {',
              '\tincludeScope: boolean,\n\tdiagnostics?: ScopeDerivationDiagnostics,\n): Promise<AssuranceReport> {'
          )
          replace(
              "scripts/session_assurance.ts",
              '\t\t{ homeDir: homedir(), signal },\n\t);',
              '\t\t{\n\t\t\thomeDir: homedir(),\n\t\t\tsignal,\n\t\t\ttoolNamePrefilter: toolName => BUILTIN_SCOPE_TOOL_NAMES.has(toolName),\n\t\t\t...(diagnostics ? { diagnostics } : {}),\n\t\t},\n\t);'
          )
          replace(
              "scripts/session_assurance.ts",
              '''\t\tfor (const summary of listed.data) {\n\t\t\tif (options.since !== null && summary.endedAt < options.since) continue;\n\t\t\tconst signal = AbortSignal.timeout(15_000);\n\t\t\tconst read = await reader.getTrace(summary.file, signal);\n\t\t\tconst cwd = read.status === "available" ? read.data.cwd : null;\n\t\t\tif (options.folder && !folderFilterMatches(options.folder, summary.folder, cwd)) continue;\n\t\t\tconst report = await reportFromTraceRead(\n\t\t\t\treader,\n\t\t\t\tsummary.file,\n\t\t\t\tread,\n\t\t\t\tsignal,\n\t\t\t\toptions.full ? DEFAULT_PROFILE_RULES : TRACE_SCAN_RULES,\n\t\t\t\toptions.full,\n\t\t\t);\n\t\t\trows.push({ summary, report });\n\t\t}\n''',
              '''\t\tfor (const summary of listed.data) {\n\t\t\tif (options.since !== null && summary.endedAt < options.since) continue;\n\t\t\tif (options.folder && !folderFilterMatches(options.folder, summary.folder, null)) continue;\n\t\t\tconst signal = AbortSignal.timeout(15_000);\n\t\t\tconst read = await reader.getTrace(summary.file, signal);\n\t\t\tconst scopeDiagnostics = options.full ? createScopeDerivationDiagnostics() : undefined;\n\t\t\tconst report = await reportFromTraceRead(\n\t\t\t\treader,\n\t\t\t\tsummary.file,\n\t\t\t\tread,\n\t\t\t\tsignal,\n\t\t\t\toptions.full ? DEFAULT_PROFILE_RULES : TRACE_SCAN_RULES,\n\t\t\t\toptions.full,\n\t\t\t\tscopeDiagnostics,\n\t\t\t);\n\t\t\trows.push({ summary, report, ...(scopeDiagnostics ? { scopeDiagnostics } : {}) });\n\t\t}\n'''
          )
          replace(
              "scripts/session_assurance.ts",
              '\tif (!report.discovery.syncAvailable || !report.discovery.listAvailable)\n\t\tlines.push(`Discovery incomplete: ${report.discovery.reason ?? "unknown"}`);\n',
              '\tif (!report.discovery.syncAvailable || !report.discovery.listAvailable)\n\t\tlines.push(`Discovery incomplete: ${report.discovery.reason ?? "unknown"}`);\n\tif (report.performance?.scope) {\n\t\tconst scope = report.performance.scope;\n\t\tlines.push(`Scope recovery: ${scope.candidates} candidates | ${scope.prefilteredUnsupported} prefiltered unsupported | ${scope.recoveryAttempts} recovered | ${scope.entryReadRequests} entry reads | ${scope.entryCacheHits} cache hits`);\n\t\tlines.push(`Scope timing: ${(scope.totalMs / 1000).toFixed(1)}s total | ${(scope.recoveryMs / 1000).toFixed(1)}s entry recovery | ${(scope.classificationMs / 1000).toFixed(3)}s classification | ${scope.parentHops} parent hops`);\n\t}\n'
          )

          replace(
              "scripts/session_evidence.ts",
              '\t\tfor (const summary of summaries) {\n\t\t\tif (options.since !== null && summary.endedAt < options.since) continue;\n\t\t\tconst revision = sessionRevision(summary);',
              '\t\tfor (const summary of summaries) {\n\t\t\tif (options.since !== null && summary.endedAt < options.since) continue;\n\t\t\tif (options.folder && !folderFilterMatches(options.folder, summary.folder, null)) continue;\n\t\t\tconst revision = sessionRevision(summary);'
          )
          replace(
              "scripts/session_evidence.ts",
              '''\t\t\tif (stored?.source.revision === revision && storedHasCwd) {\n\t\t\t\tif (!options.folder || folderFilterMatches(options.folder, stored.session.folder, stored.session.cwd)) skipped += 1;\n\t\t\t\tcontinue;\n\t\t\t}\n\n\t\t\tconst trace = requireEvidence(await client.getTrace(summary.file));\n\t\t\tif (options.folder && !folderFilterMatches(options.folder, summary.folder, trace.cwd)) continue;\n''',
              '''\t\t\tif (stored?.source.revision === revision && storedHasCwd) {\n\t\t\t\tskipped += 1;\n\t\t\t\tcontinue;\n\t\t\t}\n\n\t\t\tconst trace = requireEvidence(await client.getTrace(summary.file));\n'''
          )
          replace(
              "scripts/session_evidence.ts",
              '--folder accepts the normal project filesystem path (or a folder substring). Matching prefers the public trace cwd and also accepts OMP\'s summary folder value.',
              '--folder accepts the normal project filesystem path (or a folder substring). OMP 18.2.1+ exposes the real working directory through SessionSummary.folder, so filtering happens before trace reads.'
          )

          replace(
              "tests/ts/session-assurance-scan.test.ts",
              'function summary(file: string, endedAt: number, folder = "-project-omp-kit"): SessionSummary {',
              'function summary(file: string, endedAt: number, folder = "/work/omp-kit"): SessionSummary {'
          )
          replace(
              "tests/ts/session-assurance-scan.test.ts",
              'function catalogReader(summaries: SessionSummary[], traces: Map<string, SessionTrace>, entryCall?: () => void): OmpStatsClient {',
              'function catalogReader(summaries: SessionSummary[], traces: Map<string, SessionTrace>, entryCall?: () => void, traceCall?: (file: string) => void): OmpStatsClient {'
          )
          replace(
              "tests/ts/session-assurance-scan.test.ts",
              '\t\tasync getTrace(file) {\n\t\t\tconst value = traces.get(file);',
              '\t\tasync getTrace(file) {\n\t\t\ttraceCall?.(file);\n\t\t\tconst value = traces.get(file);'
          )
          replace(
              "tests/ts/session-assurance-scan.test.ts",
              '''test("scan applies since and real-cwd folder filters while keeping catalog bounds explicit", async () => {\n\tconst a = "/private/a.jsonl";\n\tconst b = "/private/b.jsonl";\n\tconst reader = catalogReader(\n\t\t[summary(a, 200, "storage-a"), summary(b, 100, "storage-b")],\n\t\tnew Map([[a, trace(a, [span()], "/work/target")], [b, trace(b, [span()], "/work/other")]]),\n\t);\n\tconst result = await scanAssuranceReports(reader, {\n\t\tcommand: "scan",\n\t\tjson: false,\n\t\tlimit: 2,\n\t\tfolder: "/work/target",\n\t\tsince: 150,\n\t\tfull: false,\n\t});\n\tassert.equal(result.report.sessions.scanned, 1);\n\tassert.deepEqual(result.report.discovery.limitations, ["bounded-session-list", "list-limit-reached"]);\n\tassert.equal(result.report.filters.folderApplied, true);\n\tassert.equal(result.report.filters.since, 150);\n});\n''',
              '''test("scan applies since and summary-folder filters before trace reads", async () => {\n\tconst a = "/private/a.jsonl";\n\tconst b = "/private/b.jsonl";\n\tlet traceCalls = 0;\n\tconst reader = catalogReader(\n\t\t[summary(a, 200, "/work/target"), summary(b, 200, "/work/other")],\n\t\tnew Map([[a, trace(a, [span()], "/stale/trace-cwd")], [b, trace(b, [span()], "/work/other")]]),\n\t\tundefined,\n\t\t() => { traceCalls += 1; },\n\t);\n\tconst result = await scanAssuranceReports(reader, {\n\t\tcommand: "scan",\n\t\tjson: false,\n\t\tlimit: 2,\n\t\tfolder: "/work/target",\n\t\tsince: 150,\n\t\tfull: false,\n\t});\n\tassert.equal(traceCalls, 1);\n\tassert.equal(result.report.sessions.scanned, 1);\n\tassert.deepEqual(result.report.discovery.limitations, ["bounded-session-list", "list-limit-reached"]);\n\tassert.equal(result.report.filters.folderApplied, true);\n\tassert.equal(result.report.filters.since, 150);\n});\n\ntest("full scan prefilters unsupported tool names before selected-entry reads", async () => {\n\tconst file = "/private/bash-only.jsonl";\n\tlet entryCalls = 0;\n\tconst reader = catalogReader(\n\t\t[summary(file, 200)],\n\t\tnew Map([[file, trace(file, [span({ label: "bash" })])]]),\n\t\t() => { entryCalls += 1; },\n\t);\n\tconst result = await scanAssuranceReports(reader, {\n\t\tcommand: "scan",\n\t\tjson: true,\n\t\tlimit: 1000,\n\t\tfolder: null,\n\t\tsince: null,\n\t\tfull: true,\n\t});\n\tassert.equal(entryCalls, 0);\n\tassert.equal(result.report.performance?.scope.candidates, 1);\n\tassert.equal(result.report.performance?.scope.prefilteredUnsupported, 1);\n\tassert.equal(result.report.performance?.scope.recoveryAttempts, 0);\n\tassert.equal(result.report.performance?.scope.entryReadRequests, 0);\n});\n'''
          )
      - name: Commit focused edits
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/session_assurance.ts scripts/session_evidence.ts tests/ts/session-assurance-scan.test.ts
          git commit -m "perf: prune assurance evidence reads"
          git push origin HEAD:feat/omp-18.2.3-assurance-performance
