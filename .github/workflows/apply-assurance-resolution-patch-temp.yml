name: Temporary assurance resolution patch

on:
  push:
    branches:
      - refactor/assurance-resolution-layer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/assurance-resolution-layer
      - name: Apply bounded assurance resolution patch
        shell: python
        run: |
          from pathlib import Path

          p = Path("scripts/session_assurance.ts")
          text = p.read_text()
          old = 'import { coverageGapRule } from "../src/assurance/rules/coverage-gap";\nimport { missingTerminalRule } from "../src/assurance/rules/terminal-missing";'
          new = 'import { coverageGapRule } from "../src/assurance/rules/coverage-gap";\nimport { resolutionGapRule } from "../src/assurance/rules/resolution-gap";\nimport { missingTerminalRule } from "../src/assurance/rules/terminal-missing";'
          assert old in text
          text = text.replace(old, new, 1)
          old = 'const TRACE_SCAN_RULES: readonly AssuranceRule[] = [toolErrorRule, missingTerminalRule, coverageGapRule];'
          new = 'const TRACE_SCAN_RULES: readonly AssuranceRule[] = [toolErrorRule, missingTerminalRule, resolutionGapRule, coverageGapRule];'
          assert old in text
          text = text.replace(old, new, 1)
          old = 'active-branch traces. The default first pass is trace-only: it evaluates tool errors,\nmissing terminals and coverage/conflicts without selected-entry scope enrichment.'
          new = 'active-branch traces. The default first pass is trace-only: it evaluates tool errors,\nmissing-terminal evidence, resolution gaps and coverage/conflicts without selected-entry\nscope enrichment.'
          assert old in text
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path("tests/ts/session-assurance-triage.test.ts")
          text = p.read_text()
          old = 'import { toolErrorRule } from "../../src/assurance/rules/tool-error";'
          new = 'import { resolutionGapRule } from "../../src/assurance/rules/resolution-gap";\nimport { missingTerminalRule } from "../../src/assurance/rules/terminal-missing";\nimport { toolErrorRule } from "../../src/assurance/rules/tool-error";'
          assert old in text
          text = text.replace(old, new, 1)
          old = '''\tassert.deepEqual(result.candidates[0].codes, [\n\t\t"terminal-missing:tool-terminal-missing",\n\t\t"tool-error:tool-reported-error",\n\t]);'''
          new = '''\tassert.deepEqual(result.candidates[0].codes, [\n\t\t"resolution-gap:tool-resolution-unobserved",\n\t\t"terminal-missing:tool-terminal-missing",\n\t\t"tool-error:tool-reported-error",\n\t]);'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''\tassert.match(rendered, /Attention[\\s\\S]*Missing terminal evidence: 0/);\n\tassert.match(rendered, /Evidence[\\s\\S]*Tool errors reported: 1/);\n\tassert.match(rendered, /Supporting evidence is retained for review context/);\n\tassert.equal(value.rules.find(rule => rule.ruleId === toolErrorRule.meta.id)?.presentation.section, "evidence");'''
          new = '''\tassert.match(rendered, /Attention[\\s\\S]*Resolution gaps: 0/);\n\tassert.match(rendered, /Evidence[\\s\\S]*Missing terminal observations: 0[\\s\\S]*Tool errors reported: 1/);\n\tassert.match(rendered, /Supporting evidence is retained for review context/);\n\tassert.equal(value.rules.find(rule => rule.ruleId === toolErrorRule.meta.id)?.presentation.section, "evidence");\n\tassert.equal(value.rules.find(rule => rule.ruleId === missingTerminalRule.meta.id)?.presentation.section, "evidence");\n\tassert.equal(value.rules.find(rule => rule.ruleId === resolutionGapRule.meta.id)?.presentation.section, "attention");'''
          assert old in text
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path("docs/session-assurance.md")
          text = p.read_text()
          text = text.replace(
              '-> tool-error / terminal-missing / coverage-conflict rules\n',
              '-> tool-error / terminal-missing / resolution-gap / coverage-conflict rules\n',
              1,
          )
          text = text.replace(
              'coverage, optional observed-scope facts, rule execution results and generic\nevidence-linked findings. The current default full-report profile enables four\nbuilt-in rules:',
              'coverage, optional observed-scope facts, rule execution results and generic\nevidence-linked findings. The current default full-report profile enables five\nbuilt-in rules:',
              1,
          )
          old = '''| `omp-kit.tool-error` / `tool-error` | A tool span explicitly reports an error | The entire task failed or no side effect occurred |\n| `omp-kit.terminal-missing` / `terminal-missing` | Every available sample for an action marks its terminal missing | A process is still running or certainly failed |\n| `omp-kit.coverage-gap` / `coverage-gap` | A trace limit, unavailable/unassessed source, conflict or inherently unobserved surface | An unobserved effect did not occur |'''
          new = '''| `omp-kit.tool-error` / `tool-error` | A tool span explicitly reports an error; supporting evidence only | The entire task failed or no side effect occurred |\n| `omp-kit.terminal-missing` / `terminal-missing` | Every available sample for an action lacks terminal evidence; supporting evidence only | A process is still running or certainly failed |\n| `omp-kit.resolution-gap` / `resolution-gap` | Promotes a missing terminal into bounded review semantics, including a yielded task result with no observed parent delivery | The work is still executing, failed, or was unauthorized |\n| `omp-kit.coverage-gap` / `coverage-gap` | A trace limit, unavailable/unassessed source, conflict or inherently unobserved surface | An unobserved effect did not occur |'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '`tool-error` is presented in the Evidence section rather than Attention: it records an observed failure signal, while terminal gaps and scope expansion remain current attention triggers. A future post-failure consequence rule should be derived from ordered session evidence rather than treating every tool error as equivalent.'
          new = '`tool-error` and raw `terminal-missing` findings are presented in the Evidence section rather than Attention. `resolution-gap` is the attention layer for missing closure: a normal missing background span remains `background-resolution-unobserved`; for OMP 18.2.3 async task jobs, a child track that has a successful observed `yield` while the parent background span remains unterminated is reported as `task-result-undelivered`. OMP stats opens a background span on `async-running` and closes it only on parent `async-result` delivery, so child yield is not treated as parent resolution. Scope expansion remains a separate attention signal.'
          assert old in text
          text = text.replace(old, new, 1)
          old = 'Historical scanning has now been exercised over 136 normal OMP sessions and used to reduce tool-error triage noise. Still required by #31: inspect representative attention candidates and non-candidates, exercise rewind/child-read behavior, and use ordered real-session evidence to decide whether a post-failure recovery/consequence slice materially helps human review.'
          new = 'Historical scanning has now been exercised over 136 normal OMP sessions and used to reduce tool-error triage noise. Three representative terminal candidates were then inspected: a task child that yielded without observed parent delivery, a mixed error/background session, and a scope-expansion session. This motivated separating raw missing-terminal evidence from resolution attention without yet dropping bash/background candidates. Still required by #31: rerun the historical scan to inspect the distribution of `task-result-undelivered` versus generic resolution gaps, sample both families, and exercise rewind/child-read behavior before further triage changes.'
          assert old in text
          text = text.replace(old, new, 1)
          p.write_text(text)
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/session_assurance.ts tests/ts/session-assurance-triage.test.ts docs/session-assurance.md
          git commit -m "refactor: layer terminal evidence and resolution attention"
          git push origin HEAD:refactor/assurance-resolution-layer
