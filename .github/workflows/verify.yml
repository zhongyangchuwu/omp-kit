name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - omp-native-foundation-core
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Detect Bun gate
        id: bun
        shell: bash
        run: |
          if [[ -f bun.lock ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Bun
        if: steps.bun.outputs.required == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Bun dependencies
        if: steps.bun.outputs.required == 'true'
        run: bun install --frozen-lockfile

      - name: Check Python lockfile freshness
        run: uv lock --check

      - name: Run deterministic gate
        run: just verify

      - name: Check tracked-file drift
        run: git diff --exit-code
