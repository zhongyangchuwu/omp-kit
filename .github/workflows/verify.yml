name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: chore/omp-18.2.5-compatibility
          fetch-depth: 2

      - name: Install uv and Python for AutoDL
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Bun dependencies
        run: |
          bun install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git diff --cached --quiet || git commit -m "chore: regenerate Bun lock for OMP 18.2.5"
          git push origin HEAD:chore/omp-18.2.5-compatibility

      - name: Check AutoDL Python lockfile freshness
        run: uv lock --project skills/autodl --check

      - name: Run deterministic gate
        run: just verify

      - name: Check candidate changed lines
        run: git diff --check HEAD^ HEAD

      - name: Check tracked-file drift
        run: git diff --exit-code
