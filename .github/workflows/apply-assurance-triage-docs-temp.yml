name: Temporary assurance triage docs patch

on:
  push:
    branches:
      - refactor/assurance-signal-triage

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/assurance-signal-triage
      - name: Update assurance docs
        shell: python
        run: |
          from pathlib import Path

          p = Path("docs/session-assurance.md")
          text = p.read_text()
          text = text.replace(
              "-> tool-error / terminal-missing / coverage-conflict rules\n-> aggregate counts + candidate session keys\n",
              "-> tool-error / terminal-missing / coverage-conflict rules\n-> keep tool-error as supporting evidence; select candidates from attention/dynamic coverage\n-> aggregate counts + candidate session keys\n",
              1,
          )
          text = text.replace(
              "failed read or conflicting observation do.\n\nThe scan is intended for #31 dogfood",
              "failed read or conflicting observation do. Rule presentation is carried in each rule result, so historical triage can distinguish `attention`, supporting `evidence`, and `coverage` without hard-coding rule IDs. A supporting-evidence finding remains counted and is included as context on a session selected for another reason, but does not create a candidate by itself.\n\nHistorical OMP 18.2.3 dogfood over 136 sessions produced 85 candidates under the original all-non-coverage policy. Of those, 65 were selected only by `tool-error`, 19 combined tool errors with terminal-missing evidence, and 1 had terminal-missing alone. Treating tool errors as supporting evidence therefore reduces the same trace-only candidate set from 85/136 (62.5%) to 20/136 (14.7%) without dropping a terminal-missing session. This is a triage decision, not a claim that tool errors are unimportant.\n\nThe scan is intended for #31 dogfood",
              1,
          )
          text = text.replace(
              "observations, not silently promoted to recovered/successful or stale evidence.\n\nObserved scope",
              "observations, not silently promoted to recovered/successful or stale evidence. `tool-error` is presented in the Evidence section rather than Attention: it records an observed failure signal, while terminal gaps and scope expansion remain current attention triggers. A future post-failure consequence rule should be derived from ordered session evidence rather than treating every tool error as equivalent.\n\nObserved scope",
              1,
          )
          text = text.replace(
              "Still required by #31: run the new scan over real historical/normal sessions, inspect\ncandidate and non-candidate samples, exercise rewind/child-read behavior, and decide\nwhich next semantic slice materially helps human review.",
              "Historical scanning has now been exercised over 136 normal OMP sessions and used to reduce tool-error triage noise. Still required by #31: inspect representative attention candidates and non-candidates, exercise rewind/child-read behavior, and use ordered real-session evidence to decide whether a post-failure recovery/consequence slice materially helps human review.",
              1,
          )
          p.write_text(text)
      - name: Commit docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/session-assurance.md
          git commit -m "docs: record assurance triage dogfood"
          git push origin HEAD:refactor/assurance-signal-triage
