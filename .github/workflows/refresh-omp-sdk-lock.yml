name: Refresh OMP SDK lock

on:
  push:
    branches:
      - docs/dev-install-workflow
    paths:
      - .github/workflows/refresh-omp-sdk-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/dev-install-workflow
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --lockfile-only
      - name: Commit refreshed lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh Bun lock for OMP 18.2.0"
          git push origin HEAD:docs/dev-install-workflow
