name: Temporary assurance docs patch

on:
  push:
    branches:
      - feat/omp-18.2.3-assurance-performance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omp-18.2.3-assurance-performance
      - name: Update current docs
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected snippet in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "docs/session-assurance.md",
              "A full Scope V1 report may read selected public session entries for each tool action\nand walk a bounded parent chain to recover structured tool-call input. That is useful\nfor one session, but multiplying it across a large history can create many local\nentry reads.\n",
              "A full Scope V1 report may read selected public session entries for each tool action\nand walk a bounded parent chain to recover structured tool-call input. That is useful\nfor one session, but multiplying it across a large history can create many local\nentry reads. On OMP 18.2.3, built-in full scans first use the trace tool label as a\nconservative prefilter: tool names that no built-in Scope V1 classifier supports are\nrecorded as `unsupported-tool` without selected-entry recovery. Supported tool names\nstill recover structured arguments before classification.\n"
          )
          replace(
              "docs/session-assurance.md",
              "- aggregate action, subagent, attention-finding and dynamic-coverage-gap counts;\n- finding-code counts;\n",
              "- aggregate action, subagent, attention-finding and dynamic-coverage-gap counts;\n- optional full-scan scope diagnostics (`candidates`, prefiltered unsupported actions,\n  recovery attempts, actual entry reads/cache hits, parent hops and timing);\n- finding-code counts;\n"
          )
          replace(
              "docs/session-assurance.md",
              "separation, privacy projection, selected-entry scope recovery, explicit unclassified\nactions, per-track scope expansion, batch catalog/filter behavior, zero-entry default\nscan, opaque-key drill-down, CLI exit behavior and no-IO help.",
              "separation, privacy projection, selected-entry scope recovery, explicit unclassified\nactions, per-track scope expansion, batch catalog/filter behavior, pre-trace folder\npruning, zero-entry default scan, unsupported-tool prefiltering, full-scan diagnostics,\nopaque-key drill-down, CLI exit behavior and no-IO help."
          )

          marker = "### OMP 18.2.0 triage — 2026-09-15\n"
          baseline = """### OMP 18.2.3 triage — 2026-09-17\n\nOMP 18.2.3 is the current exact dependency for omp-kit. Review covered 18.2.1–18.2.3 and the released stats/session source used by evidence and assurance.\n\nRelevant findings:\n\n- **Session folder contract repaired:** 18.2.1 fixed `/api/sessions` so `SessionSummary.folder` is the real working directory instead of an encoded storage key. Evidence and assurance collectors now apply `--folder` before trace reads; the old trace-`cwd` filtering workaround is retired.\n- **Tool-error evidence improved:** 18.2.1 preserves non-throwing tool failure status through extension result rewrites and eval-defined subagent tools. Historical pre-18.2.1 error counts remain useful samples but are not directly comparable to current-runtime coverage.\n- **Background/subagent terminal semantics changed:** 18.2.2 settles stopped-subagent parent jobs correctly and adjusts consumed/recovered background-job retention; 18.2.3 keeps cancelled jobs tracked until execution actually finishes. Historical `terminal-missing` findings must therefore retain runtime-version context.\n- **Selected-entry bulk bottleneck remains:** 18.2.3 still serves `/api/session/entry` through single-entry lookup over the transcript. omp-kit avoids unnecessary calls by prefiltering unsupported built-in Scope tool names, but a future OMP batch/indexed selected-entry surface may still be justified by measured dogfood.\n- **No maintained contract break found:** agent frontmatter, native plugin installation, feedback provenance, public trace/span shapes used by omp-kit, and stable result/history retrieval remain compatible for current use.\n\nThe 18.2.3 exact pin is validated by the repository deterministic gate. This source/type compatibility evidence is separate from the local historical full-scan timing measurement that motivated the Scope read optimization.\n\n"""
          replace("docs/omp-compatibility.md", marker, baseline + marker)
          replace(
              "docs/omp-compatibility.md",
              "The collector uses public trace cwd for path filtering, with the upstream report `can1357/oh-my-pi#12060`. See [validation](VALIDATION.md) for exact evidence and retest limitations.",
              "That historical mismatch was fixed in OMP 18.2.1. On the current 18.2.3 baseline, collectors use `SessionSummary.folder` for pre-trace path filtering; trace `cwd` remains evidence metadata rather than the folder-filter workaround. See [validation](VALIDATION.md) for the older acceptance evidence and its historical limitation."
          )
      - name: Commit docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/session-assurance.md docs/omp-compatibility.md
          git commit -m "docs: record OMP 18.2.3 assurance behavior"
          git push origin HEAD:feat/omp-18.2.3-assurance-performance
